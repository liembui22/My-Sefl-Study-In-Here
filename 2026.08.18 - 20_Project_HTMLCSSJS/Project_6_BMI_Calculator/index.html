<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-quiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Body Mass Index (BMI) Calculator</h2>

        Your height (cm):
        <input type="number" class="input" id="height" value="" placeholder="Enter your height">
        Your weight (kg):
        <input type="number" class="input" id="Weight" value="" placeholder="Enter your Weight">

        <button class="btn" id="btn">Compute BMT</button>

        <input disable type="text" class="input" id="bmi-result">

        <h4 class="info-text">Weight Condition:</h4>
        <span id="weight-condition"></span>

    </div>
    <script src="index.js"></script>
</body>
</html>
