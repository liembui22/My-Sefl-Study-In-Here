<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Convertor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1 class="heading">Weight Convertor</h1>
        <div class="input-container">
            <label for="pound">Pound:</label>
            <input type="Number" id="input" class="input" step="0.1" placeholder="Enter your number">
        </div>
        <p>Your weight in kg is:<span id="result"> 300</span></p>
        <p class="error" id="error"></p>
    </div>

    <script src="index.js"></script>
</body>
</html>
